name: CI

# Fix #36-followup: branch filter was `main` but the default branch
# is `master`, so this workflow literally never ran on push. Trigger
# on both so we don't silently regress if the default ever moves.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
